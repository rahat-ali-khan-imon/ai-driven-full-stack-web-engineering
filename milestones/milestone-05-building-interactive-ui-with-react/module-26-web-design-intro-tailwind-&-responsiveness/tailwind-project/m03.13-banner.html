<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Manrope", sans-serif;
        }
    </style>
</head>
<body>
    <!-- Banner Section -->
    <section class="border border-red-500 container mx-auto grid grid-cols-2 mt-16">
        <div class="banner-content space-y-7.5 bg-green-500">
            <h2 class="text-[80px] font-extrabold text-[#1C1C1C] leading-25">It's good <br> tea time at The <br> Tea House</h2>
            <p class="text-[18px] font-medium text-[#777777] leading-7.5">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.</p>
            
            <button class="px-5 py-4.5 text-[20px] font-bold text-[#FFFFFF] bg-linear-to-r from-[#ff8938] to-[#ff0000] rounded-[10px]">
                Explore More <span class="-rotate-45 inline-block"><i class="fa-solid fa-arrow-right"></i></span>
            </button>
        </div>

        <div class="banner-image bg-purple-500 flex justify-end items-end">
            <img src="./assets/images/banner.png" alt="">

            <!-- Rating Badge -->
            <div class="bg-[#FFFFFF] rounded-xl shadow-2xl flex justify-center items-center w-63.75">
                <img src="./assets/images/banner-rating.png" alt="">

                <div>
                    <h2 class="text-[30px] font-extrabold text-[#1C1C1C]">5.00</h2>
                    <p class="text-[16px] font-semibold text-[#777777]">Trust Pilot Ratings</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Position Learning -->
    <div class="bg-green-500">
        <div class="h-25 w-25 bg-red-500">Relative</div>                  <!-- -->
        <div class="h-25 w-25 bg-purple-500">Position</div>
    </div>
</body>
</html>
