<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS For Beginners</title>
    <style>
        p {
            color: skyblue;
        }

        h4 {
            color: red;
        }
        
        .argentina {                                /* class */
            color: blue;
        }
    </style>
</head>
<body>
    <p>This is a sample paragraph.</p>
    <p>This is a fourth paragraph.</p>
    <p>This is a fourth paragraph.</p>
    <p class="argentina">This is a fourth paragraph.</p>                        <!-- class -->
    <p>This is a fourth paragraph.</p>
    <p class="argentina">This is a fourth paragraph.</p>

    <a href="https://www.google.com/" target="_blank">Google</a>
    <a href="https://learningsystemdesign.netlify.app/" target="_blank">System Design</a>

    <h2>This is a heading.</h2>
    <h4 class="argentina">This is a subheading.</h4>
    <h4>This is 2 subheading.</h4>
</body>
</html>
