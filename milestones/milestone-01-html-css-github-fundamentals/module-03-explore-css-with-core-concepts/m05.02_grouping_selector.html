<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Selectors</title>
    <style>
        ol, ul {                                         /* Grouping Selector */
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h2>This is a heading.</h2>
    <p>This is a sample paragraph.</p>
    <ol>
        <li>Item - 1</li>
        <li>Item - 2</li>
        <li>Item - 3</li>
        <li>Item - 4</li>
        <li>Item - 5</li>
    </ol>
    <!-- ul>li{Item - $}*5 -->
    <ul>
        <li>Item - 1</li>
        <li>Item - 2</li>
        <li>Item - 3</li>
        <li>Item - 4</li>
        <li>Item - 5</li>
    </ul>
</body>
</html>
