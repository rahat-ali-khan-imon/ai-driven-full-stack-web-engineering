<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <main>
        <h2>Table HTML</h2>
        <table>
            <thead>
                <tr>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>                                            <!-- -->
                    <td>Len Messi</td>
                    <td>Striker</td>
                    <td>messi@argentina.com</td>
                </tr>
            </tbody>
            <tfoot>
                <tr></tr>
            </tfoot>
        </table>
        <ul>
            <li>Table: table</li>
            <li>Table Head: thead</li>
            <li>Table Body: tbody</li>
            <li>Table Row: tr</li>
            <li>Table Data: td</li>
            <li>Table Heading: th</li>
            <li>Table Footer: tfoot</li>
        </ul>
    </main>
</body>
</html>
